<svg viewBox="0 0 720 220" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="720" height="220" rx="12" fill="#0d1117"/>

  <!-- Client Devices -->
  <rect x="30" y="70" width="150" height="60" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="105" y="95" fill="#c9d1d9" font-size="14" font-weight="600" text-anchor="middle">Client</text>
  <text x="105" y="113" fill="#8b949e" font-size="12" text-anchor="middle">Devices</text>

  <!-- Switch/AP -->
  <rect x="285" y="70" width="150" height="60" rx="8" fill="#161b22" stroke="#1BA0D7" stroke-width="1.5"/>
  <text x="360" y="95" fill="#c9d1d9" font-size="14" font-weight="600" text-anchor="middle">Switch / AP</text>
  <text x="360" y="113" fill="#8b949e" font-size="12" text-anchor="middle">L2 / Wi-Fi</text>

  <!-- Router -->
  <rect x="540" y="70" width="150" height="60" rx="8" fill="#161b22" stroke="#1BA0D7" stroke-width="1.5"/>
  <text x="615" y="95" fill="#c9d1d9" font-size="14" font-weight="600" text-anchor="middle">Router</text>
  <text x="615" y="113" fill="#8b949e" font-size="12" text-anchor="middle">L3 / WAN</text>

  <!-- Core -->
  <rect x="465" y="165" width="225" height="45" rx="8" fill="#161b22" stroke="#FF7A00" stroke-width="1.5"/>
  <text x="577" y="192" fill="#c9d1d9" font-size="13" font-weight="600" text-anchor="middle">Fiber Optic / MikroTik Core</text>

  <!-- Connectors -->
  <line x1="180" y1="100" x2="285" y2="100" stroke="#30363d" stroke-width="2"/>
  <polygon points="285,95 285,105 278,100" fill="#30363d"/>
  <polygon points="180,95 180,105 187,100" fill="#30363d"/>

  <line x1="435" y1="100" x2="540" y2="100" stroke="#30363d" stroke-width="2"/>
  <polygon points="540,95 540,105 533,100" fill="#30363d"/>
  <polygon points="435,95 435,105 442,100" fill="#30363d"/>

  <line x1="615" y1="130" x2="615" y2="165" stroke="#30363d" stroke-width="2"/>
  <polygon points="610,165 620,165 615,172" fill="#30363d"/>
</svg>
