<svg viewBox="0 0 900 540" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <radialGradient id="glow" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#1BA0D7" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#1BA0D7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#1c2330" stroke-width="1"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#30363d"/>
    </marker>
  </defs>

  <rect width="900" height="540" rx="14" fill="#0a0e14"/>
  <rect width="900" height="540" rx="14" fill="url(#grid)"/>
  <rect width="900" height="220" rx="14" fill="url(#glow)"/>

  <!-- Internet cloud -->
  <g transform="translate(400,40)">
    <ellipse cx="0" cy="10" rx="70" ry="26" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <ellipse cx="-32" cy="4" rx="26" ry="18" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <ellipse cx="32" cy="4" rx="26" ry="18" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="0" y="16" fill="#c9d1d9" font-size="13" font-weight="600" text-anchor="middle">Internet</text>
  </g>
  <line x1="400" y1="66" x2="400" y2="105" stroke="#30363d" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Firewall -->
  <g transform="translate(345,105)">
    <rect width="110" height="50" rx="8" fill="#161b22" stroke="#E5484D" stroke-width="1.5"/>
    <rect x="14" y="14" width="10" height="22" fill="#E5484D" opacity="0.8"/>
    <rect x="28" y="10" width="10" height="26" fill="#E5484D" opacity="0.8"/>
    <rect x="42" y="16" width="10" height="20" fill="#E5484D" opacity="0.8"/>
    <text x="72" y="30" fill="#c9d1d9" font-size="12" font-weight="600" text-anchor="middle">Firewall</text>
  </g>
  <line x1="400" y1="155" x2="400" y2="190" stroke="#30363d" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Router -->
  <g transform="translate(330,190)">
    <rect width="140" height="55" rx="8" fill="#161b22" stroke="#1BA0D7" stroke-width="1.5"/>
    <circle cx="20" cy="27" r="4" fill="#3fb950"/>
    <text x="80" y="24" fill="#c9d1d9" font-size="13" font-weight="600" text-anchor="middle">Router</text>
    <text x="80" y="40" fill="#8b949e" font-size="11" text-anchor="middle">L3 / WAN Edge</text>
  </g>

  <!-- Fiber to core -->
  <line x1="400" y1="245" x2="400" y2="280" stroke="#FF7A00" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="418" y="266" fill="#FF7A00" font-size="10">fiber</text>

  <!-- Core switch / MikroTik -->
  <g transform="translate(300,280)">
    <rect width="200" height="55" rx="8" fill="#161b22" stroke="#FF7A00" stroke-width="1.5"/>
    <text x="100" y="24" fill="#c9d1d9" font-size="13" font-weight="600" text-anchor="middle">MikroTik Core Switch</text>
    <text x="100" y="40" fill="#8b949e" font-size="11" text-anchor="middle">RouterOS · L2/L3 backbone</text>
    <circle cx="20" cy="27" r="4" fill="#3fb950"/>
  </g>

  <!-- Branch lines to two access switches -->
  <line x1="360" y1="335" x2="185" y2="380" stroke="#30363d" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="440" y1="335" x2="615" y2="380" stroke="#30363d" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Access switch (wired) -->
  <g transform="translate(110,380)">
    <rect width="150" height="50" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <rect x="12" y="34" width="14" height="8" fill="#3fb950"/>
    <rect x="30" y="34" width="14" height="8" fill="#3fb950"/>
    <rect x="48" y="34" width="14" height="8" fill="#8b949e"/>
    <text x="105" y="24" fill="#c9d1d9" font-size="12" font-weight="600" text-anchor="middle">Access Switch</text>
    <text x="105" y="39" fill="#8b949e" font-size="10" text-anchor="middle">Wired clients</text>
  </g>

  <!-- Wireless AP -->
  <g transform="translate(540,380)">
    <rect width="150" height="50" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <path d="M 65 8 Q 65 -10 82 -10" fill="none" stroke="#1BA0D7" stroke-width="2"/>
    <path d="M 58 8 Q 58 -1 71 -1" fill="none" stroke="#1BA0D7" stroke-width="1.5" opacity="0.6"/>
    <circle cx="65" cy="10" r="3" fill="#1BA0D7"/>
    <text x="75" y="30" fill="#c9d1d9" font-size="12" font-weight="600" text-anchor="middle">Wireless AP</text>
    <text x="75" y="44" fill="#8b949e" font-size="10" text-anchor="middle">Wi-Fi clients</text>
  </g>

  <!-- Wired client devices -->
  <line x1="150" y1="430" x2="150" y2="465" stroke="#30363d" stroke-width="2"/>
  <line x1="220" y1="430" x2="220" y2="465" stroke="#30363d" stroke-width="2"/>
  <g transform="translate(120,465)">
    <rect width="60" height="38" rx="4" fill="#161b22" stroke="#484f58"/>
    <rect width="60" height="6" fill="#21262d"/>
    <text x="30" y="52" fill="#8b949e" font-size="9" text-anchor="middle">Laptop</text>
  </g>
  <g transform="translate(190,465)">
    <rect width="60" height="38" rx="4" fill="#161b22" stroke="#484f58"/>
    <circle cx="30" cy="16" r="8" fill="none" stroke="#484f58" stroke-width="2"/>
    <text x="30" y="52" fill="#8b949e" font-size="9" text-anchor="middle">Desktop</text>
  </g>

  <!-- Wireless client devices -->
  <line x1="580" y1="430" x2="580" y2="465" stroke="#30363d" stroke-width="2" stroke-dasharray="3 3"/>
  <line x1="650" y1="430" x2="650" y2="465" stroke="#30363d" stroke-width="2" stroke-dasharray="3 3"/>
  <g transform="translate(550,465)">
    <rect width="60" height="38" rx="8" fill="#161b22" stroke="#484f58"/>
    <text x="30" y="52" fill="#8b949e" font-size="9" text-anchor="middle">Phone</text>
  </g>
  <g transform="translate(620,465)">
    <rect width="60" height="38" rx="4" fill="#161b22" stroke="#484f58"/>
    <text x="30" y="52" fill="#8b949e" font-size="9" text-anchor="middle">Tablet</text>
  </g>
</svg>
